databases:
  - name: tmm-postgres
    databaseName: tmm_db
    user: tmm_user
    plan: free

services:
  - type: web
    name: tmm-app
    runtime: python
    plan: free
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tmm-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AISSTREAM_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DEBUG
        value: "false"
