<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Code 101</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { claude: '#e8692a' },
            fontSize: {
              'xs':   ['0.875rem', { lineHeight: '1.4' }],
              'sm':   ['1rem',     { lineHeight: '1.6' }],
              'base': ['1.125rem', { lineHeight: '1.75' }],
              'lg':   ['1.25rem',  { lineHeight: '1.75' }],
              'xl':   ['1.375rem', { lineHeight: '1.75' }],
              '2xl':  ['1.625rem', { lineHeight: '1.4' }],
              '3xl':  ['2rem',     { lineHeight: '1.3' }],
              '4xl':  ['2.5rem',   { lineHeight: '1.2' }],
              '5xl':  ['3.25rem',  { lineHeight: '1.1' }],
            },
          },
        },
      }
    </script>
    <style>
      body { background-color: #0a0a0a; color: #f3f4f6; font-size: 16px; }
      .scrollbar-thin::-webkit-scrollbar { width: 6px; }
      .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .scrollbar-thin::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
